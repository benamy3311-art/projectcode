<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectCode - Comparador de Versiones</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>P</text></svg>">
  <style>
    :root {
      --bg-toolbar: #0f1117;
      --border-color: #242835;
      --text-main: #f0f3f8;
      --text-muted: #8c93a8;
      --accent-blue: #0071e3;
      --accent-green: #30d158;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #08090d;
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .compare-toolbar {
      height: 54px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      z-index: 100;
      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toolbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      text-decoration: none;
    }

    .toolbar-brand span {
      color: var(--accent-blue);
    }

    .toolbar-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(0, 113, 227, 0.18);
      color: #58a6ff;
      border: 1px solid rgba(0, 113, 227, 0.35);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    select {
      background: #181b24;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-toggle-btn {
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.3);
      color: #30d158;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .sync-toggle-btn.disabled {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
      color: var(--text-muted);
    }

    .btn-return {
      background: #232734;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.16s ease;
    }

    .btn-return:hover {
      background: #2c3242;
      border-color: #3e4559;
    }

    .compare-viewport {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 54px);
      position: relative;
      background: #000000;
    }

    .compare-pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
      min-width: 0;
      position: relative;
    }

    .compare-pane-header {
      height: 38px;
      background: #141720;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .pane-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pane-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .pane-tag-left {
      background: rgba(48, 209, 88, 0.2);
      color: #30d158;
    }

    .pane-tag-right {
      background: rgba(0, 113, 227, 0.2);
      color: #58a6ff;
    }

    .pane-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11.5px;
      transition: color 0.15s;
    }

    .pane-link:hover {
      color: var(--accent-blue);
      text-decoration: underline;
    }

    .pane-frame-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100% - 38px);
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .compare-divider {
      width: 4px;
      background: var(--border-color);
      cursor: col-resize;
      position: relative;
      z-index: 10;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .compare-divider:hover {
      background: var(--accent-blue);
    }
  </style>
</head>
<body>

  <header class="compare-toolbar">
    <div class="toolbar-left">
      <a href="index.html" class="toolbar-brand">
        Project<span>Code</span>
      </a>
      <span class="toolbar-badge">Comparador</span>
    </div>

    <div class="toolbar-center">
      <div class="select-group">
        <label for="selectLeft">Izquierda:</label>
        <select id="selectLeft">
          <option value="live.html" selected>Original (Live)</option>
          <option value="codex.html">Codex (Nueva)</option>
          <option value="definitiva.html">Definitiva (Hibrida)</option>
        </select>
      </div>
      <div class="select-group">
        <label for="selectRight">Derecha:</label>
        <select id="selectRight">
          <option value="definitiva.html" selected>Definitiva (Hibrida)</option>
          <option value="codex.html">Codex (Nueva)</option>
          <option value="live.html">Original (Live)</option>
        </select>
      </div>
    </div>

    <div class="toolbar-right">
      <button type="button" class="sync-toggle-btn" id="btnSyncScroll">
        Scroll sincronizado
      </button>
      <a href="index.html" class="btn-return">
        Volver a la web
      </a>
    </div>
  </header>

  <main class="compare-viewport" id="compareViewport">
    <section class="compare-pane" id="paneLeft">
      <header class="compare-pane-header">
        <div class="pane-title">
          <span class="pane-tag pane-tag-left" id="tagLeft">Panel Izquierdo</span>
          <span id="titleLeft">Original (Live)</span>
        </div>
        <a href="live.html" target="_blank" class="pane-link" id="linkLeft">
          Abrir completa
        </a>
      </header>
      <div class="pane-frame-wrap">
        <iframe id="frameLeft" src="live.html" title="Panel Izquierdo"></iframe>
      </div>
    </section>

    <div class="compare-divider" id="compareDivider" title="Arrastrar para ajustar ancho"></div>

    <section class="compare-pane" id="paneRight">
      <header class="compare-pane-header">
        <div class="pane-title">
          <span class="pane-tag pane-tag-right" id="tagRight">Panel Derecho</span>
          <span id="titleRight">Definitiva (Hibrida)</span>
        </div>
        <a href="definitiva.html" target="_blank" class="pane-link" id="linkRight">
          Abrir completa
        </a>
      </header>
      <div class="pane-frame-wrap">
        <iframe id="frameRight" src="definitiva.html" title="Panel Derecho"></iframe>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      const selectLeft = document.getElementById('selectLeft');
      const selectRight = document.getElementById('selectRight');
      const frameLeft = document.getElementById('frameLeft');
      const frameRight = document.getElementById('frameRight');
      const titleLeft = document.getElementById('titleLeft');
      const titleRight = document.getElementById('titleRight');
      const linkLeft = document.getElementById('linkLeft');
      const linkRight = document.getElementById('linkRight');
      const syncBtn = document.getElementById('btnSyncScroll');

      let isSyncActive = true;
      let isSyncingScroll = false;

      function updatePanel(select, frame, title, link) {
        const val = select.value;
        frame.src = val;
        link.href = val;
        title.textContent = select.options[select.selectedIndex].text;
      }

      selectLeft.addEventListener('change', () => updatePanel(selectLeft, frameLeft, titleLeft, linkLeft));
      selectRight.addEventListener('change', () => updatePanel(selectRight, frameRight, titleRight, linkRight));

      syncBtn.addEventListener('click', () => {
        isSyncActive = !isSyncActive;
        syncBtn.classList.toggle('disabled', !isSyncActive);
        syncBtn.textContent = isSyncActive ? 'Scroll sincronizado' : 'Scroll independiente';
      });

      function setupFrameSync(sourceFrame, targetFrame) {
        try {
          const srcWin = sourceFrame.contentWindow;
          const tgtWin = targetFrame.contentWindow;

          srcWin.addEventListener('scroll', () => {
            if (!isSyncActive || isSyncingScroll) return;
            isSyncingScroll = true;

            const srcDoc = srcWin.document.documentElement;
            const tgtDoc = tgtWin.document.documentElement;

            const maxSrc = Math.max(1, srcDoc.scrollHeight - srcWin.innerHeight);
            const maxTgt = Math.max(1, tgtDoc.scrollHeight - tgtWin.innerHeight);

            const ratio = srcWin.scrollY / maxSrc;
            tgtWin.scrollTo({ top: ratio * maxTgt, behavior: 'instant' });

            requestAnimationFrame(() => {
              isSyncingScroll = false;
            });
          }, { passive: true });
        } catch (e) {}
      }

      frameLeft.addEventListener('load', () => setupFrameSync(frameLeft, frameRight));
      frameRight.addEventListener('load', () => setupFrameSync(frameRight, frameLeft));

      const divider = document.getElementById('compareDivider');
      const paneLeft = document.getElementById('paneLeft');
      const viewport = document.getElementById('compareViewport');
      let isDragging = false;

      divider.addEventListener('mousedown', (e) => {
        isDragging = true;
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const containerRect = viewport.getBoundingClientRect();
        const offsetX = e.clientX - containerRect.left;
        const percent = Math.max(20, Math.min(80, (offsetX / containerRect.width) * 100));
        paneLeft.style.flex = `0 0 ${percent}%`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.cursor = '';
        }
      });
    })();
  </script>
</body>
</html>
